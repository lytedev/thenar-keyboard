units:
  kx: cx  # cx=18
  ky: cy  # cy=17
  mbkx: 17.5
  mbky: 16.5
  padding: 2
  px: kx+padding
  py: ky+padding
  mcu_height: 34
  mcu_width: 18
  # distance keys to mcu
  mcu_padding: 1.5
  scrollwheel_width: 17
  scrollwheel_height: 14
  screw_diameter: 4.7
  screw_hole: 4.1
  screen_screw_diameter: 4
  screen_screw_hole: 2.2
  switchplate_switch_cutout: 14
  # EVQWGD001 clearance, from the RollerEncoder footprint envelope: body
  # silk x -8.4..8.4 / y +-7.4 (union of both reversible mounts) plus the
  # wheel slot reaching x 9.8 / y +-7.6 on the +x (wheel) side. Margins
  # are >=1mm per side; the wheel side runs to 12.5 so the cutout opens
  # through the plate's outer edge at +11.5 (a closed rim there would be
  # a <1mm unprintable sliver).
  switchplate_scrollwheel_pad_side: 9.4
  switchplate_scrollwheel_wheel_side: 12.5
  switchplate_scrollwheel_cutout_y: 17.2
  switchplate_screw_diameter: 3.3
  switchplate_screw_hole: 2.2
  # Reset button access notch. The kbd:ResetSW body+pads span 8.5x3.5mm
  # centred 27mm from the mcu point, only ~1mm clear of the plate edge at
  # nominal - found interfering on the first assembled unit. 12x9 centred
  # on the button leaves >=1.75mm per side and deepens the MCU notch edge
  # by ~1.8mm for finger/tweezer access.
  switchplate_reset_cutout_x: 12
  switchplate_reset_cutout_y: 9
points:
  rotate: 5
  zones:
    matrix:
      # fix placement on kicad
      anchor.shift: [50, -150]
      key:
        tags: [switch]
        padding: 1ky
        spread: 1kx
      columns:
        outer:
          rows:
            mod.skip: true
          key:
            column_net: row0
        pinky:
          rows:
            mod.skip: true
          key:
            origin: [0, 8]
            column_net: row1
        ring:
          rows:
            mod.skip: true
          key:
            origin: [0, 8]
            stagger: 0.66ky
            splay: -5
            column_net: row2
        middle:
          key:
            stagger: 0.33ky
            column_net: row3
          rows:
            mod:
              column_net: row1
        index:
          key:
            stagger: -0.33ky
            column_net: row4
          rows:
            mod:
              column_net: row2
        inner:
          rows:
            mod.skip: true
          key:
            stagger: -2.5
            column_net: row5
      rows:
        mod:
          row_net: col4
          tags: [switch_bottom]
        bottom:
          row_net: col3
          tags: [switch_top]
        home:
          row_net: col2
          tags: [switch_bottom]
        top:
          row_net: col1
          tags: [switch_top]
        num:
          row_net: col0
          tags: [switch_bottom]
    thumbs:
      anchor:
        ref: matrix_middle_home
        shift: [38, -44]
      key:
        tags: [switch]
        padding: 1ky
        spread: 1kx
      columns:
        layer:
          key:
            splay: -15
            column_net: row3
        space:
          key:
            width: 1.5kx
            splay: 75
            shift: [13-kx, -3]
            column_net: row4
            tags: [switch_space]
      rows:
        cluster:
          row_net: col4
    scrollwheel:
      anchor:
        ref: matrix_inner_bottom
      columns:
        scrollwheel:
          key:
            tags: [scrollwheel]
            shift: [kx+mcu_padding-1.25, 0]
            column_net: row5
            width: scrollwheel_width
            height: scrollwheel_height
      rows:
        scrollwheel:
          row_net: col4
    mcu:
      anchor:
        ref: matrix_inner_num
      columns:
        mcu:
          key:
            tags: [mcu]
            width: mcu_height  # footprint width/height unintuitive
            height: mcu_width
            rotate: -90
            shift: [kx+mcu_padding, -mcu_width/2-0.3]
    screw_top_left:
      anchor:
        ref.aggregate.parts: [matrix_ring_num, matrix_ring_top]
        shift: [-11, 0]
      columns.screw.key.tags: [screw]
    screw_top_right:
      anchor:
        ref.aggregate.parts: [matrix_index_num, matrix_inner_num, matrix_index_top, matrix_inner_top]
      columns.screw.key.tags: [screw]
    screw_bottom_left:
      anchor:
        ref.aggregate.parts: [matrix_outer_home, matrix_outer_bottom, matrix_pinky_home, matrix_pinky_bottom]
      columns.screw.key.tags: [screw]
    screw_bottom_right:
      anchor:
        ref.aggregate.parts: [matrix_index_bottom, matrix_index_mod]
        shift: [-0.5kx, 0]
      columns.screw.key.tags: [screw]
    screw_thumb:
      anchor:
        ref.aggregate.parts: [thumbs_layer_cluster, thumbs_space_cluster]
        shift: [9, 7]
      columns.screw.key.tags: [screw]
outlines:
  board:
    - what: polygon
      operation: stack
      fillet: 2
      points:
        - ref: matrix_outer_home
          shift: [-0.5px, -0.5py]
        - ref: matrix_outer_home
          shift: [-0.5px, 0.5py]
        - ref: matrix_outer_top
          shift: [-0.5px, 0.5py]
        - ref: matrix_outer_num
          shift: [-0.5px, 0.5py]
        - ref: matrix_pinky_num
          shift: [-0.5px, 0.5py]
        - ref: matrix_ring_num
          shift: [-0.5px, 0.5py]
        - ref: matrix_middle_num
          shift: [-0.5px, 0.5py]
        - ref: matrix_middle_num
          shift: [0.5px, 0.5py]
        - ref: matrix_inner_num
          shift: [0.5px, 0.5py]
        - ref: matrix_inner_num
          shift: [0.5px+mcu_padding+mcu_width+0.25, 0.5py]  
        - ref: matrix_inner_bottom
          shift: [0.5px+mcu_padding+mcu_width+0.25, -0.5py]
        - ref: thumbs_space_cluster
          shift: [0.5px, -0.5py]
        - ref: thumbs_space_cluster
          shift: [-0.5px, -0.5py]
        - ref: matrix_index_mod
          shift: [-0.5px, -0.5py]  
        - ref: matrix_pinky_bottom
          shift: [0.5px, -0.5py]  
        - ref: matrix_outer_bottom
          shift: [-0.5px, -0.5py]
  _switchplate_base:
    - what: polygon
      operation: stack
      fillet: 2
      points:
        - ref: matrix_outer_home
          shift: [-0.5px, -0.5py]
        - ref: matrix_outer_home
          shift: [-0.5px, 0.5py]
        - ref: matrix_outer_top
          shift: [-0.5px, 0.5py]
        - ref: matrix_outer_num
          shift: [-0.5px, 0.5py]
        - ref: matrix_pinky_num
          shift: [-0.5px, 0.5py]
        - ref: matrix_ring_num
          shift: [-0.5px, 0.5py]
        - ref: matrix_middle_num
          shift: [-0.5px, 0.5py]
        - ref: matrix_middle_num
          shift: [0.5px, 0.5py]
        - ref: matrix_inner_num
          shift: [0.5px-0.5, 0.5py]
        - ref: matrix_inner_bottom
          shift: [0.5px-0.5, 0.5py+2.5]
        - ref: matrix_inner_bottom
          shift: [0.5px+mcu_padding+mcu_width+0.25, 0.5py+2.5]  
        - ref: matrix_inner_bottom
          shift: [0.5px+mcu_padding+mcu_width+0.25, -0.5py]
        - ref: thumbs_space_cluster
          shift: [0.5px, -0.5py]
        - ref: thumbs_space_cluster
          shift: [-0.5px, -0.5py]
        - ref: matrix_index_mod
          shift: [-0.5px, -0.5py]  
        - ref: matrix_pinky_bottom
          shift: [0.5px, -0.5py]  
        - ref: matrix_outer_bottom
          shift: [-0.5px, -0.5py]
  _switch_cutout:
    - what: rectangle
      where: [switch, switch_top, switch_bottom, switch_space]
      size: switchplate_switch_cutout
      bound: false
  _scrollwheel_cutout:
    # The encoder is asymmetric - pads toward the board centre, wheel
    # overhanging the outer edge - but the old 17.5x14.5 rectangle was
    # centred on the point, covering the wheel slot by ~1mm while leaving
    # spare room on the pad side. Found on the first assembled unit (the
    # plate had to be hand-cut at the wheel). Anchored to the scrollwheel
    # zone point, shifted so the asymmetric margins land where the
    # hardware is; see the switchplate_scrollwheel_* units.
    - what: rectangle
      where:
        ref: scrollwheel_scrollwheel_scrollwheel
        shift: [(switchplate_scrollwheel_wheel_side-switchplate_scrollwheel_pad_side)/2, 0]
      size: [switchplate_scrollwheel_pad_side+switchplate_scrollwheel_wheel_side, switchplate_scrollwheel_cutout_y]
      bound: false
  _screw_holes:
    - what: circle
      where: [screw]
      radius: 0.5switchplate_screw_hole
  _reset_cutout:
    # Clearance notch over the reset button. Anchored exactly like the
    # `reset` footprint below (mcu point + [10+mcu_height/2, 0] in the
    # mcu's -90deg local frame); rotate 90 un-rotates the anchor so the
    # rectangle's x/y match board x/y.
    - what: rectangle
      where:
        ref: mcu_mcu
        shift: [10+mcu_height/2, 0]
        rotate: 90
      size: [switchplate_reset_cutout_x, switchplate_reset_cutout_y]
      bound: false
  switchplate:
    - what: outline
      name: _switchplate_base
    - what: outline
      name: _switch_cutout
      operation: subtract
    - what: outline
      name: _scrollwheel_cutout
      operation: subtract
    - what: outline
      name: _reset_cutout
      operation: subtract
  case:
    - what: outline
      name: board
    - what: outline
      name: _screw_holes
      operation: subtract  
pcbs:
  keyboard:
    outlines.main.outline: board
    footprints:
      choc_hotswap:
        what: choc
        where: [switch, switch_space, switch_bottom, switch_top]
        params:
          keycaps: true
          reverse: true
          hotswap: true
          from: "{{column_net}}"
          to: "{{colrow}}"
        adjust:
          rotate: 180
      diode_bottom:
        what: diode
        where: [switch, switch_bottom]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          rotate: 0
          shift: [0, -9.5]
      diode_top:
        what: diode
        where: [switch_top]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          rotate: 0
          shift: [0, 5.2]
      diode_space:
        what: diode
        where: [switch_space]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          rotate: -90
          # 8.275 is exactly above the pad
          shift: [8.275, 1]
      scrollwheel:
        # Each encoder pin (A/B/C/D) gets a UNIQUE local net (sw_a..sw_d)
        # instead of a shared-copper hybrid like ENCB_undef. The local nets
        # have only one routing endpoint each (the encoder pad), and the
        # jumpers below bridge them to real signals (ENCA, ENCB, GND)
        # depending on which side the encoder is mounted on. This is the
        # same single-net-per-pad pattern ceoloide's footprints use - it
        # unblocks freerouting on this design.
        what: scrollwheel_mirrored
        where: [scrollwheel]
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
          A: sw_a
          B: sw_b
          C: sw_c
          D: sw_d
      scroll_diode:
        what: diode
        where: [scrollwheel]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [-5, -9]
      # B-side mount: pin order is A=ENCB, B=GND, C=ENCA. (D=unused.)
      jumper_sw_left_encb:
        what: jumper
        where: [scrollwheel]
        params:
          side: B
          from: ENCB
          to: sw_a
        adjust:
          rotate: 90
          shift: [-3, 3.81]
      jumper_sw_left_gnd:
        what: jumper
        where: [scrollwheel]
        params:
          side: B
          from: GND
          to: sw_b
        adjust:
          rotate: 90
          shift: [-3, 1.27]
      jumper_sw_left_enca:
        what: jumper
        where: [scrollwheel]
        params:
          side: B
          from: ENCA
          to: sw_c
        adjust:
          rotate: 90
          shift: [-3, -1.27]
      # F-side mount: pin order is reversed - D=ENCB, C=GND, B=ENCA. (A=unused.)
      jumper_sw_right_encb:
        what: jumper
        where: [scrollwheel]
        params:
          side: F
          from: ENCB
          to: sw_d
        adjust:
          rotate: 90
          shift: [-3, -3.81]
      jumper_sw_right_gnd:
        what: jumper
        where: [scrollwheel]
        params:
          side: F
          from: GND
          to: sw_c
        adjust:
          rotate: 90
          shift: [-3, -1.27]
      jumper_sw_right_enca:
        what: jumper
        where: [scrollwheel]
        params:
          side: F
          from: ENCA
          to: sw_b
        adjust:
          rotate: 90
          shift: [-3, 1.27]
      nicenano:
        # ceoloide's mcu_nice_nano - single-net-per-pad with internal
        # reversibility jumpers (same pattern as display_nice_view). Replaces
        # the old corax-style approach that used 8 external jumpers + 6
        # hybrid nets (RAW_P1, P1_RAW, GND_RST, etc.) to share copper.
        what: mcu_nice_nano
        where: mcu
        adjust:
          # ceoloide's footprint is naturally tall (long axis Y); ours was
          # naturally wide (long axis X). The mcu anchor already rotates -90
          # for our wide-style; flip another 90 here so ceoloide's tall layout
          # ends up matching the old physical pad positions.
          rotate: 90
        params:
          side: 'F'
          reversible: true
          RAW: RAW
          GND: GND
          RST: RST
          VCC: VCC
          P21: ENCA
          P20: ENCB
          P19: row0
          P18: row1
          P15: row2
          P14: row3
          P16: row4
          P10: row5
          P1: P1
          P0: P0
          P2: SDA
          P3: SCL
          P4: CS
          P5: col0
          P6: col1
          P7: col2
          P8: col3
          P9: col4
      niceview:
        # ceoloide's display_nice_view footprint - one net per pad, generates
        # its own reversibility jumpers internally. This replaces the old
        # corax-style "two pads numbered 1 with different nets" pattern,
        # which produced DRC shorting_items errors that blocked Specctra DSN
        # export and therefore freerouting.
        what: display_nice_view
        where: mcu
        adjust:
          # See thenar/scripts/niceview_placement.py - that script solves
          # for these values so ceoloide's pads land on the exact same
          # absolute positions the old corax-style niceview occupied.
          shift: [37.2, 0]
          rotate: -90
        params:
          side: 'F'
          reversible: true
          MOSI: SDA  # Nice!View MOSI pin = our SDA net (named historically)
          SCK: SCL   # Nice!View SCK pin = our SCL net
          VCC: VCC
          GND: GND
          CS: CS
      # WARNING (see docs/battery-and-power.md): the battery is wired
      # battery+ -> slider -> the nice!nano's RAW pin, NOT its B+ pad.
      # On the nice!nano v2 the onboard charger AND the VDDH battery-
      # voltage sense both live on B+/B- - RAW feeds only the regulator.
      # Consequences on v1 hardware:
      #   - battery level always reads ~0% (VDDH/B+ is unconnected)
      #   - USB does NOT charge the LiPo (the charger charges B+)
      # This is a footprint limitation: mcu_nice_nano.js exposes only the
      # castellated edge pins (RAW/GND/VCC/RST/Pxx), no B+/B- pads, so RAW
      # was the only power-input pad available. v1 rework: solder the LiPo
      # straight to the module's B+/B- pads (bypasses this path; loses the
      # slider cutoff). v2 fix: add B+/B- pads and route battery -> slider
      # -> B+ (like the hypothenar routes battery -> slider -> VBAT), which
      # restores both sensing and USB charging with the slider ON.
      slider:
        what: slider_reversible
        where: mcu
        adjust:
          shift: [-17.1, 0]
          rotate: 90
        params:
          side: F
          reverse: true
          from: switch_from
          to: RAW
      battery:
        what: battery
        where: mcu
        adjust:
          shift: [-17, 0]
        params:
          RAW: switch_from
      reset:
        what: reset
        where: mcu
        params:
          from: GND
          to: RST
        adjust:
          shift: [10+mcu_height/2, 0]
          rotate: -90
      plexi_inner:
        what: hole
        where: mcu
        params:
          size: screen_screw_diameter
          drill: screen_screw_hole
        adjust:
          shift: [10+mcu_height/2, -mcu_width/2+1.5]
      plexi_outer:
        what: hole
        where: mcu
        params:
          size: screen_screw_diameter
          drill: screen_screw_hole
        adjust:
          shift: [10+mcu_height/2, mcu_width/2-1.5]
      screw_holes:
        what: hole
        where: [screw]
        params:
          size: screw_diameter
          drill: screw_hole
      left_text:
        what: text
        where: matrix_middle_home
        params:
          text: "Left Hand Up"
          side: F
          knockout: true
          fontsize: 1.6
        adjust:
          shift: [0, 4]
          rotate: 90
      right_text:
        what: text
        where: matrix_middle_home
        params:
          text: "Right Hand Up"
          side: B
          knockout: true
          fontsize: 1.6
        adjust:
          rotate: 90
          shift: [0, 4]
      order_number_text:
        what: text
        where: [switch_space]
        params:
          side: B
          text: "JLCJLCJLCJLC"
        adjust:
          rotate: 10
          shift: [-9.5, 10]
      name_text:
        what: text
        where: matrix_middle_mod
        params:
          text: "Thenar rev. 1.0"
        adjust:
          rotate: 82
          shift: [-9, -11]
      name_text_right:
        what: text
        where: matrix_middle_mod
        params:
          side: B
          text: "Thenar rev. 1.0"
        adjust:
          rotate: 82
          shift: [-9, -11]
  switchplate:
    outlines.main.outline: switchplate
    footprints:
      - what: hole
        where: screw
        params:
          size: switchplate_screw_diameter
          drill: switchplate_screw_hole
