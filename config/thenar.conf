# Enable the EC11 quadrature decoder driver for the scrollwheel encoder.
# Without these the alps,ec11 devicetree nodes exist but no driver is
# compiled in, and rotation silently does nothing (the encoder press is
# unaffected - it goes through the key matrix, not this driver).
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse keys (&mmv/&msc/&mkp) for the Iris adjust layer and the Miryoku
# mouse layer in the keymap.
CONFIG_ZMK_POINTING=y

# Radio TX power +8dBm (the nRF52840's maximum; default is 0dBm). This
# strengthens BOTH BLE hops: central<->host and, importantly, the split
# central<->peripheral link. A weak split link showed up as high latency
# and keys arriving out of order - right-hand (peripheral) keystrokes
# retransmit and arrive late, interleaving with left-hand keys typed
# after. Costs a little battery for a large reliability gain.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# BLE connection parameters for the central<->host link.
#
# ZMK's defaults are LATENCY=30 with an interval range of 7.5-15ms, chosen
# for battery life. Peripheral latency lets the keyboard skip up to N
# connection events, so the worst-case time to deliver a report is
# interval x (latency + 1) = 15ms x 31 = 465ms. Measured on 2026-07-28: key
# press->release intervals topped out at 463ms against a ~170ms norm, and a
# release arriving that late reads to the desktop as a still-held key, so
# its auto-repeat fires and you get "thoughhhhhhhhh".
#
# LATENCY=0 stops the radio skipping events; pinning MAX_INT to MIN_INT
# (both 6 = 7.5ms) removes the host's freedom to pick the slow end of the
# range. Worst case becomes 7.5ms.
#
# COSTS BATTERY - the radio now wakes every 7.5ms instead of coasting for
# up to 30 events. If idle drain is too high, raise LATENCY back toward 30
# and re-measure; the worst case scales linearly with it.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6

# NOTE: do NOT add CONFIG_ZMK_USB_LOGGING=y here for debugging. On this ZMK
# version it y-selects USB_CDC_ACM / UART_CONSOLE / UART_INTERRUPT_DRIVEN
# whose own dependencies (SERIAL, CONSOLE, USB_DEVICE_STACK, a devicetree
# cdc-acm-uart node) are unmet, so Zephyr aborts on the Kconfig warnings.
# Build `nix build .#firmware-debug` instead - it applies the official
# zmk-usb-logging snippet, which pulls those dependencies in properly.
# https://zmk.dev/docs/development/usb-logging