manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      # Pin to a stable release, NOT main. A `main` snapshot (ZMK on
      # Zephyr 4.1) built a 50 KB image with no USB HID and no BLE -
      # the board enumerated with zero USB interfaces and no keypress
      # could ever register. See docs/known-issues.md.
      revision: v0.3.0
      import: app/west.yml
  self:
    path: config
